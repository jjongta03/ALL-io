# User-selected free trial. Postgres expires 30 days after creation.
# No paid resources or cron jobs are created by this Blueprint.
services:
  - type: web
    name: allio-web-trial
    runtime: node
    repo: https://github.com/jjongta03/ALL-io
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: live
      # APP_URL defaults to Render's trusted RENDER_EXTERNAL_URL.
      - key: MAWD_DATABASE_URL
        fromDatabase:
          name: allio-postgres-trial
          property: connectionString
      - key: CONTRACT_ENCRYPTION_KEY_BASE64
        generateValue: true
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: BOOTSTRAP_OWNER_PASSWORD
        generateValue: true
      - key: EMAIL_TRANSPORT
        value: local
      - key: LIVE_INTEGRATIONS_ENABLED
        value: "false"
      - key: SOURCE_COLLECTION_ENABLED
        value: "false"
      - key: POLICY_WATCH_ENABLED
        value: "false"
      - key: DRAFT_GENERATION_ENABLED
        value: "false"
      - key: JEV_ENABLED
        value: "false"
      - key: CONTRACT_SCAN_ENABLED
        value: "false"
      - key: STIBEE_CONTACT_SYNC_ENABLED
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
databases:
  - name: allio-postgres-trial
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
