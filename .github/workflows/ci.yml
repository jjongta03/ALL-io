name: Check foundations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: local
      APP_MODE: demo
      LIVE_INTEGRATIONS_ENABLED: "false"
      EMAIL_TRANSPORT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run setup
      - run: npm run build
